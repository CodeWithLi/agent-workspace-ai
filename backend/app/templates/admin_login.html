<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Workspace 管理后台</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:#f3f6fa;color:#162333;min-height:100vh;display:grid;place-items:center}
    main{width:min(420px,calc(100vw - 32px));background:#fff;border:1px solid #dce4ed;border-radius:8px;padding:28px;box-shadow:0 18px 50px rgba(20,38,60,.12)}
    h1{font-size:24px;margin:0 0 8px}p{color:#637184;margin:0 0 24px}label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}input{width:100%;height:42px;border:1px solid #ccd6e2;border-radius:6px;padding:0 12px;font-size:15px}button{width:100%;height:42px;margin-top:20px;border:0;border-radius:6px;background:#2563d9;color:#fff;font-weight:700;cursor:pointer}.error{padding:10px;background:#fff1f0;color:#b42318;border-radius:6px}
  </style>
</head>
<body><main><h1>Agent Workspace AI</h1><p>Python 管理后台</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post" action="/admin/login"><label for="email">管理员邮箱</label><input id="email" name="email" type="email" required autocomplete="username"><label for="password">密码</label><input id="password" name="password" type="password" required autocomplete="current-password"><button type="submit">登录管理后台</button></form></main></body>
</html>
