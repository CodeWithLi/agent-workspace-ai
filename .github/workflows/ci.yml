name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      MINIO_ACCESS_KEY: ci-minio-access
      MINIO_SECRET_KEY: ci-minio-secret
      SECRET_KEY: ci-compose-secret-key-with-32-characters
      FIRST_SUPERUSER_EMAIL: admin@example.com
      LLM_API_KEY: ci-placeholder-key
      DATABASE_URL: postgresql+psycopg://postgres:ci-postgres-password@postgres:5432/agent_workspace_ai
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agent_workspace_ai
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_workspace_ai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/agent_workspace_ai
      SECRET_KEY: ci-only-secret-key
      AUTO_CREATE_SCHEMA: "false"
      WORKFLOW_WORKER_ENABLED: "false"
      KNOWLEDGE_WORKER_ENABLED: "false"
      NOTIFICATION_WORKER_ENABLED: "false"
      PROTOTYPE_GENERATION_WORKER_ENABLED: "false"
      PROTOTYPE_GENERATION_PG_INTEGRATION: "1"
      EVALUATION_WORKER_ENABLED: "false"
      EVALUATION_PG_INTEGRATION: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: alembic upgrade head
      - run: alembic heads
      - run: alembic current
      - run: alembic check
      - run: python -m pytest -q

  rag-integration:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/agent_workspace_ai
      SECRET_KEY: ci-rag-integration-secret
      AUTO_CREATE_SCHEMA: "false"
      LLM_FALLBACK_ENABLED: "true"
      RAG_QUERY_REWRITE_ENABLED: "false"
      EMBEDDING_DIMENSIONS: "64"
      MILVUS_HOST: 127.0.0.1
      MILVUS_PORT: "19530"
      MILVUS_COLLECTION: knowledge_chunks_ci_${{ github.run_id }}_${{ github.run_attempt }}
      VECTOR_FALLBACK_ENABLED: "false"
      WORKFLOW_WORKER_ENABLED: "false"
      KNOWLEDGE_WORKER_ENABLED: "false"
      NOTIFICATION_WORKER_ENABLED: "false"
      RAG_REAL_INTEGRATION: "1"
      RAG_MULTI_VECTOR_ENABLED: "true"
      RAG_INTEGRATION_MAX_P95_MS: "3000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Start PostgreSQL and Milvus dependencies
        run: docker compose up -d postgres minio etcd milvus
      - name: Wait for services
        shell: bash
        run: |
          for attempt in {1..60}; do
            if docker compose exec -T postgres pg_isready -U postgres -d agent_workspace_ai >/dev/null 2>&1 \
              && curl --fail --silent http://127.0.0.1:9091/healthz >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          exit 1
      - run: pip install -r requirements.txt -r requirements-dev.txt
        working-directory: backend
      - run: alembic upgrade head
        working-directory: backend
      - run: python -m pytest -q tests/test_rag_real_integration.py
        working-directory: backend
      - if: always()
        run: docker compose logs --no-color postgres etcd minio milvus
      - if: always()
        run: docker compose down -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
