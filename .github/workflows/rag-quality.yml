name: RAG Model Quality Gate

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Evaluation model provider
        required: true
        default: open-models
        type: choice
        options:
          - open-models
          - external
  schedule:
    - cron: "0 20 1 * *"

permissions:
  contents: read

jobs:
  open-models:
    if: github.event_name == 'schedule' || inputs.provider == 'open-models'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LLM_FALLBACK_ENABLED: "false"
      RAG_QUERY_REWRITE_ENABLED: "true"
      RAG_QUERY_REWRITE_MAX_VARIANTS: "3"
      RAG_MULTI_VECTOR_ENABLED: "true"
      RERANKER_CANDIDATE_LIMIT: "40"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
      CMAKE_ARGS: -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: rag-open-models-v1-${{ runner.os }}-${{ hashFiles('backend/requirements-rag-open-model-eval.txt') }}
      - run: pip install -r backend/requirements-rag-open-model-eval.txt
      - name: Run pinned open-model legacy baseline
        run: >-
          RAG_MULTI_VECTOR_ENABLED=false python scripts/evaluate_rag_end_to_end.py
          --provider local-open-models
          --require-reranker
          --chunk-strategy legacy
          --max-p95-end-to-end-ms 120000
          --output .run/rag-open-model-baseline.json
      - name: Run pinned open-model answer-quality A/B gate
        run: >-
          python scripts/evaluate_rag_end_to_end.py
          --provider local-open-models
          --require-reranker
          --chunk-strategy semantic
          --enforce-gates
          --baseline-report .run/rag-open-model-baseline.json
          --min-ab-primary-gain 0.05
          --max-p95-end-to-end-ms 120000
          --output .run/rag-open-model.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-open-model-${{ github.run_id }}
          path: .run/rag-open-model*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  external:
    if: github.event_name == 'workflow_dispatch' && inputs.provider == 'external'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LLM_PROVIDER: external-evaluation
      LLM_API_KEY: ${{ secrets.RAG_EVAL_LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.RAG_EVAL_LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.RAG_EVAL_LLM_MODEL }}
      LLM_FALLBACK_ENABLED: "false"
      EMBEDDING_API_KEY: ${{ secrets.RAG_EVAL_EMBEDDING_API_KEY }}
      EMBEDDING_BASE_URL: ${{ secrets.RAG_EVAL_EMBEDDING_BASE_URL }}
      EMBEDDING_MODEL: ${{ secrets.RAG_EVAL_EMBEDDING_MODEL }}
      EMBEDDING_DIMENSIONS: ${{ vars.RAG_EVAL_EMBEDDING_DIMENSIONS || '1024' }}
      RERANKER_ENABLED: "true"
      RERANKER_BASE_URL: ${{ secrets.RAG_EVAL_RERANKER_BASE_URL }}
      RERANKER_API_KEY: ${{ secrets.RAG_EVAL_RERANKER_API_KEY }}
      RERANKER_MODEL: ${{ secrets.RAG_EVAL_RERANKER_MODEL }}
      RAG_QUERY_REWRITE_ENABLED: "true"
      RAG_QUERY_REWRITE_MAX_VARIANTS: "3"
      RAG_MULTI_VECTOR_ENABLED: "true"
      LLM_INPUT_COST_PER_MILLION: ${{ vars.RAG_EVAL_LLM_INPUT_COST_PER_MILLION || '0' }}
      LLM_OUTPUT_COST_PER_MILLION: ${{ vars.RAG_EVAL_LLM_OUTPUT_COST_PER_MILLION || '0' }}
      EMBEDDING_COST_PER_MILLION: ${{ vars.RAG_EVAL_EMBEDDING_COST_PER_MILLION || '0' }}
      RERANKER_COST_PER_MILLION: ${{ vars.RAG_EVAL_RERANKER_COST_PER_MILLION || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Validate evaluation secrets
        shell: bash
        run: |
          test -n "$LLM_API_KEY"
          test -n "$LLM_BASE_URL"
          test -n "$LLM_MODEL"
          test -n "$EMBEDDING_API_KEY"
          test -n "$EMBEDDING_BASE_URL"
          test -n "$EMBEDDING_MODEL"
          test -n "$RERANKER_BASE_URL"
          test -n "$RERANKER_MODEL"
      - run: pip install -r backend/requirements.txt
      - name: Run legacy external baseline
        run: >-
          RAG_MULTI_VECTOR_ENABLED=false python scripts/evaluate_rag_end_to_end.py
          --provider external
          --require-reranker
          --chunk-strategy legacy
          --judge-model "${{ secrets.RAG_EVAL_JUDGE_MODEL }}"
          --output .run/rag-end-to-end-baseline.json
      - name: Run external answer-quality A/B gate
        run: >-
          python scripts/evaluate_rag_end_to_end.py
          --provider external
          --require-reranker
          --chunk-strategy semantic
          --enforce-gates
          --baseline-report .run/rag-end-to-end-baseline.json
          --min-ab-primary-gain 0.05
          --judge-model "${{ secrets.RAG_EVAL_JUDGE_MODEL }}"
          --output .run/rag-end-to-end.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-end-to-end-${{ github.run_id }}
          path: .run/rag-end-to-end*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
