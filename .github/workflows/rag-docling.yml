name: RAG Docling Integration

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * 0"

permissions:
  contents: read

jobs:
  docling:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DOCLING_SERVE_URL: http://127.0.0.1:5001
      DOCLING_DO_OCR: "true"
      DOCLING_TIMEOUT_SECONDS: "600"
      RAG_REAL_DOCLING: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Start Docling Serve CPU
        run: >-
          docker run -d --name docling-serve
          -p 5001:5001
          -e DOCLING_SERVE_ENABLE_UI=0
          quay.io/docling-project/docling-serve-cpu:1.26.0
      - name: Wait for Docling
        shell: bash
        run: |
          for attempt in {1..120}; do
            if curl --fail --silent http://127.0.0.1:5001/docs >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker logs docling-serve
          exit 1
      - run: pip install -r requirements.txt -r requirements-dev.txt -r requirements-rag-integration.txt
        working-directory: backend
      - run: python -m pytest -q tests/test_rag_real_docling.py
        working-directory: backend
      - if: always()
        run: docker logs docling-serve
      - if: always()
        run: docker rm -f docling-serve
