services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_workspace_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_workspace_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd

  milvus:
    image: milvusdb/milvus:v2.5.14
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    volumes:
      - milvus_data:/var/lib/milvus

  docling:
    image: quay.io/docling-project/docling-serve-cpu:1.26.0
    profiles: ["advanced-rag"]
    environment:
      DOCLING_SERVE_ENABLE_UI: "0"
      DOCLING_SERVE_API_KEY: ${DOCLING_SERVE_API_KEY:-}
    expose:
      - "5001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/docs', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 8G

  backend:
    build: ./backend
    environment:
      SECRET_KEY: ${SECRET_KEY:-please-change-this-secret}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      AUTO_CREATE_SCHEMA: "false"
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      FIRST_SUPERUSER_EMAIL: ${FIRST_SUPERUSER_EMAIL:-}
      REGISTRATION_EMAIL_DOMAINS: '${REGISTRATION_EMAIL_DOMAINS:-[]}'
      TRUSTED_HOSTS: '${TRUSTED_HOSTS:-["localhost","127.0.0.1"]}'
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/agent_workspace_ai
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-zhipu}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      LLM_MODEL: ${LLM_MODEL:-glm-4-flash}
      LLM_FALLBACK_ENABLED: ${LLM_FALLBACK_ENABLED:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      LLM_INPUT_COST_PER_MILLION: ${LLM_INPUT_COST_PER_MILLION:-0}
      LLM_OUTPUT_COST_PER_MILLION: ${LLM_OUTPUT_COST_PER_MILLION:-0}
      EMBEDDING_COST_PER_MILLION: ${EMBEDDING_COST_PER_MILLION:-0}
      EVALUATION_CASE_MIN_SCORE: ${EVALUATION_CASE_MIN_SCORE:-0.8}
      EVALUATION_MIN_AVERAGE: ${EVALUATION_MIN_AVERAGE:-0.8}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embedding-3}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-256}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      RAG_MIN_SCORE: ${RAG_MIN_SCORE:-0.2}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-900}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-140}
      RAG_CHILD_CHUNK_TOKENS: ${RAG_CHILD_CHUNK_TOKENS:-400}
      RAG_PARENT_CHUNK_TOKENS: ${RAG_PARENT_CHUNK_TOKENS:-1200}
      RAG_CHUNK_OVERLAP_TOKENS: ${RAG_CHUNK_OVERLAP_TOKENS:-100}
      RAG_MIN_CHUNK_TOKENS: ${RAG_MIN_CHUNK_TOKENS:-30}
      RAG_CHUNK_STRATEGY: ${RAG_CHUNK_STRATEGY:-structural}
      RAG_SEMANTIC_THRESHOLD: ${RAG_SEMANTIC_THRESHOLD:-0.8}
      RAG_MULTI_VECTOR_ENABLED: ${RAG_MULTI_VECTOR_ENABLED:-false}
      RAG_CONTEXT_MAX_TOKENS: ${RAG_CONTEXT_MAX_TOKENS:-4000}
      RAG_MIN_QUERY_COVERAGE: ${RAG_MIN_QUERY_COVERAGE:-0.15}
      RAG_DENSE_OVERRIDE_SCORE: ${RAG_DENSE_OVERRIDE_SCORE:-0.72}
      RAG_QUERY_REWRITE_ENABLED: ${RAG_QUERY_REWRITE_ENABLED:-true}
      RAG_QUERY_REWRITE_MAX_VARIANTS: ${RAG_QUERY_REWRITE_MAX_VARIANTS:-3}
      RERANKER_ENABLED: ${RERANKER_ENABLED:-false}
      RERANKER_BASE_URL: ${RERANKER_BASE_URL:-}
      RERANKER_API_KEY: ${RERANKER_API_KEY:-}
      RERANKER_MODEL: ${RERANKER_MODEL:-bge-reranker-v2-m3}
      RERANKER_CANDIDATE_LIMIT: ${RERANKER_CANDIDATE_LIMIT:-40}
      RERANKER_TIMEOUT_SECONDS: ${RERANKER_TIMEOUT_SECONDS:-15}
      RERANKER_COST_PER_MILLION: ${RERANKER_COST_PER_MILLION:-0}
      RAG_RERANK_OVERRIDE_SCORE: ${RAG_RERANK_OVERRIDE_SCORE:-0.6}
      RAG_FALLBACK_CANDIDATE_LIMIT: ${RAG_FALLBACK_CANDIDATE_LIMIT:-1000}
      RAG_PARSER_BACKEND: ${RAG_PARSER_BACKEND:-native}
      RAG_PARSER_FALLBACK_ENABLED: ${RAG_PARSER_FALLBACK_ENABLED:-true}
      DOCLING_SERVE_URL: ${DOCLING_SERVE_URL:-http://docling:5001}
      DOCLING_SERVE_API_KEY: ${DOCLING_SERVE_API_KEY:-}
      DOCLING_TIMEOUT_SECONDS: ${DOCLING_TIMEOUT_SECONDS:-300}
      DOCLING_DO_OCR: ${DOCLING_DO_OCR:-true}
      RAG_MAX_UNCOMPRESSED_MB: ${RAG_MAX_UNCOMPRESSED_MB:-200}
      RAG_MAX_DOCUMENT_CHARS: ${RAG_MAX_DOCUMENT_CHARS:-2000000}
      RAG_MAX_PDF_PAGES: ${RAG_MAX_PDF_PAGES:-500}
      RAG_MAX_ELEMENTS: ${RAG_MAX_ELEMENTS:-50000}
      RAG_MAX_CHUNKS: ${RAG_MAX_CHUNKS:-10000}
      KNOWLEDGE_WORKER_ENABLED: ${KNOWLEDGE_WORKER_ENABLED:-true}
      KNOWLEDGE_POLL_SECONDS: ${KNOWLEDGE_POLL_SECONDS:-1}
      KNOWLEDGE_LEASE_SECONDS: ${KNOWLEDGE_LEASE_SECONDS:-300}
      KNOWLEDGE_MAX_ATTEMPTS: ${KNOWLEDGE_MAX_ATTEMPTS:-3}
      MILVUS_HOST: milvus
      MILVUS_COLLECTION: ${MILVUS_COLLECTION:-knowledge_chunks_v4}
      VECTOR_FALLBACK_ENABLED: ${VECTOR_FALLBACK_ENABLED:-true}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      MINIO_ENDPOINT: minio:9000
      STORAGE_FALLBACK_ENABLED: ${STORAGE_FALLBACK_ENABLED:-true}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      NOTIFICATION_WORKER_ENABLED: ${NOTIFICATION_WORKER_ENABLED:-true}
      NOTIFICATION_POLL_SECONDS: ${NOTIFICATION_POLL_SECONDS:-5}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-3}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      WELCOME_AI_TOKENS: ${WELCOME_AI_TOKENS:-1000}
      CHAT_TOKEN_COST: ${CHAT_TOKEN_COST:-10}
      WORKFLOW_TOKEN_COST: ${WORKFLOW_TOKEN_COST:-100}
      RECHARGE_TOKENS_PER_YUAN: ${RECHARGE_TOKENS_PER_YUAN:-100}
      AGENT_CONCURRENCY_ACQUIRE_TIMEOUT: ${AGENT_CONCURRENCY_ACQUIRE_TIMEOUT:-3}
      AGENT_CONCURRENCY_LEASE_SECONDS: ${AGENT_CONCURRENCY_LEASE_SECONDS:-180}
      AGENT_RUN_STALE_MINUTES: ${AGENT_RUN_STALE_MINUTES:-15}
      WORKFLOW_WORKER_ENABLED: ${WORKFLOW_WORKER_ENABLED:-true}
      WORKFLOW_POLL_SECONDS: ${WORKFLOW_POLL_SECONDS:-1}
      WORKFLOW_LEASE_SECONDS: ${WORKFLOW_LEASE_SECONDS:-900}
      WORKFLOW_MAX_ATTEMPTS: ${WORKFLOW_MAX_ATTEMPTS:-2}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      milvus:
        condition: service_started
      minio:
        condition: service_started
    volumes:
      - backend_uploads:/app/storage/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
  etcd_data:
  milvus_data:
  backend_uploads:
